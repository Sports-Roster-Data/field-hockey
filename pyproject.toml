[project]
name = "field-hockey"
version = "0.1.0"
description = "NCAA field hockey roster scraper"
readme = "README_SCRAPER.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "tldextract>=3.4.0",
    "cloudscraper>=1.2.71",
    "playwright>=1.56,<1.57",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
